name: Books Instagram

# Posts the next book post from books/posts.json.
#   Fiction    @grantcanthony  Mondays and Thursdays from 18:00 UK time
#   Nonfiction @g_c_anthony    Wednesdays and Saturdays from 18:00 UK time
# A post in books/posts.json with a "date" goes out on that day instead, whatever the weekday.
# Quote, talk and excerpt posts go out as Reels (scripts/books_reels.py); if a reel fails, the image goes.
# GitHub's scheduler drops and delays runs by hours, so it wakes every 15 minutes from 17:07 UTC
# until 02:52 UTC. A run up to 03:00 UK time still counts as the evening before, so a late timer
# can't skip a day. The script picks the account for the day (or does nothing on a day with no
# posts), posts on the first run at or after 18:00 UK time (summer or winter), and every later
# run that day does nothing.
# An outside timer (cron-job.org) can also start it at 18:00 UK with scheduled=1 so it posts on time.
# To post now, or see what would go out next: Actions tab > Books Instagram > Run workflow.
# A dry run attaches the image (and the reel, if it is one) to the run as "books-instagram-preview".

on:
  schedule:
    - cron: "7,22,37,52 17-23 * * *"
    - cron: "7,22,37,52 0-2 * * *"
  workflow_dispatch:
    inputs:
      account:
        description: "Which account. auto = whichever posts today"
        type: choice
        options: [fiction, nonfiction, auto]
        default: fiction
      mode:
        description: "dry-run shows the next post without posting; post publishes it; check confirms both accounts can post"
        type: choice
        options: [dry-run, post, check]
        default: dry-run
      scheduled:
        description: "1 = behave like the schedule (post only after 18:00 UK, once a day). Used by an outside timer."
        type: string
        default: "0"

permissions:
  contents: write

concurrency:
  group: books-instagram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow numpy
      - name: Make sure ffmpeg is there (for reels)
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Post next book post
        env:
          IG_TOKEN_FICTION: ${{ secrets.IG_TOKEN_FICTION }}
          IG_TOKEN_NONFICTION: ${{ secrets.IG_TOKEN_NONFICTION }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ACCOUNT: ${{ github.event_name == 'schedule' && 'auto' || inputs.account }}
          MODE: ${{ github.event_name == 'schedule' && 'post' || inputs.mode }}
          SCHEDULED: ${{ (github.event_name == 'schedule' || inputs.scheduled == '1') && '1' || '0' }}
        run: python scripts/books_instagram.py
      - name: Keep the prepared image or reel for checking
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: books-instagram-preview
          path: books/ig/
          if-no-files-found: ignore
          retention-days: 7
