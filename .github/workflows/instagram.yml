name: Instagram

# Posts the next photograph ticked "Share to Instagram" in the Studio.
# Schedule: Tuesdays and Fridays from 18:00 UK time, all year.
# GitHub's scheduler is unreliable: it drops many scheduled runs and delays others by hours.
# So it wakes every 15 minutes from 17:07 to 22:52 UTC (24 chances each posting day).
# The script posts on the first run at or after 18:00 UK time, summer or winter, and every
# other run that day does nothing (one post a day). A run that never comes costs nothing.
# An outside timer (cron-job.org) also starts it at 18:00 UK with scheduled=1, so it posts on time
# even when GitHub's own schedule is late. Whichever arrives first posts; the others do nothing.
# To post straight away or check what would go out next: Actions tab > Instagram > Run workflow.

on:
  schedule:
    - cron: "7,22,37,52 17-22 * * 2,5"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run shows the next photo and caption without posting; post publishes it"
        type: choice
        options: [dry-run, post]
        default: dry-run
      scheduled:
        description: "1 = behave like the schedule (post only after 18:00 UK, once a day). Used by the outside timer."
        type: string
        default: "0"

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - name: Post next photograph
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MODE: ${{ github.event_name == 'schedule' && 'post' || inputs.mode }}
          SCHEDULED: ${{ (github.event_name == 'schedule' || inputs.scheduled == '1') && '1' || '0' }}
        run: python scripts/instagram.py
      - name: Keep the prepared image for checking
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-preview
          path: ig/
          if-no-files-found: ignore
          retention-days: 7
